# Збирає DevBridge для Windows, macOS і Linux.
#
#   push у main або pull request  -> файли доступні в Actions → запуск → Artifacts
#   тег v1.2.3                    -> ще й сторінка Releases з цими файлами
#   кнопка "Run workflow"         -> збірка вручну
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# новий push скасовує попередню незавершену збірку тієї самої гілки
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # помилка на одній платформі не зупиняє інші
      fail-fast: false
      matrix:
        # file1 і file2: кожен шаблон має збігатися рівно з одним файлом
        include:
          - name: Windows
            runner: windows-latest
            flag: --win
            file1: dist/DevBridge-Installer-*.exe
            file2: dist/DevBridge-*-portable.exe
          - name: macOS
            runner: macos-latest
            flag: --mac
            file1: dist/DevBridge-*-mac-arm64.dmg
            file2: dist/DevBridge-*-mac-x64.dmg
          - name: Linux
            runner: ubuntu-latest
            flag: --linux
            file1: dist/DevBridge-*-linux-*.AppImage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # без цього ad-hoc підпис для macOS пропускається в pull request
          CSC_FOR_PULL_REQUEST: 'true'

      # власне вікно інсталятора (installer/GUIDE.md)
      - name: Build custom Windows installer
        if: matrix.name == 'Windows'
        run: node installer/build.js

      # archive: false віддає файл як є, без ZIP. У цьому режимі один крок
      # завантажує лише один файл, а назвою artifact стає назва файлу.
      # Зберігаємо недовго, бо файли великі; для постійних версій є Releases.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.file1 }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: matrix.file2
        with:
          path: ${{ matrix.file2 }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не збігається з версією $version у package.json"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # не створюємо реліз, якщо якогось із файлів бракує
      - name: Check release files
        run: |
          ls -l release
          for pattern in 'DevBridge-Installer-*.exe' 'DevBridge-*-portable.exe' 'DevBridge-*-mac-arm64.dmg' 'DevBridge-*-mac-x64.dmg' 'DevBridge-*-linux-*.AppImage'; do
            if ! compgen -G "release/$pattern" > /dev/null; then
              echo "::error::У релізі немає файлу $pattern"
              exit 1
            fi
          done

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" release/* --title "DevBridge $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
