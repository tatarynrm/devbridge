<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26305a"/>
      <stop offset=".55" stop-color="#151b33"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <radialGradient id="warm" cx="512" cy="700" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9f43" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#ff9f43" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="250" cy="640" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wire" x1="250" y1="0" x2="774" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset=".5" stop-color="#b9c98a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="sq"><rect x="40" y="40" width="944" height="944" rx="214"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#warm)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#cool)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#shine)"/>

    <!-- відображення у «воді» -->
    <g opacity=".16" filter="url(#soft)">
      <path d="M250 660 Q512 1180 774 660" fill="none" stroke="url(#wire)" stroke-width="30" stroke-linecap="round"/>
    </g>
    <path d="M300 760 H470 M560 760 H720 M360 820 H520 M600 820 H670" stroke="#8aa4ff" stroke-opacity=".10" stroke-width="10" stroke-linecap="round"/>

    <!-- світіння арки -->
    <path d="M250 640 Q512 80 774 640" fill="none" stroke="url(#wire)" stroke-width="70" stroke-linecap="round" opacity=".45" filter="url(#glow)"/>

    <!-- підвіси -->
    <g stroke="#e4e8f2" stroke-opacity=".38" stroke-width="12" stroke-linecap="round">
      <path d="M354.8 470 V628"/>
      <path d="M433.4 395 V628"/>
      <path d="M512 370 V628"/>
      <path d="M590.6 395 V628"/>
      <path d="M669.2 470 V628"/>
    </g>

    <!-- полотно мосту -->
    <path d="M250 640 H774" stroke="url(#wire)" stroke-width="24" stroke-linecap="round"/>
    <!-- арка -->
    <path d="M250 640 Q512 80 774 640" fill="none" stroke="url(#wire)" stroke-width="36" stroke-linecap="round"/>

    <!-- пакет даних на арці -->
    <circle cx="590.6" cy="385" r="34" fill="#ffd9ad" opacity=".55" filter="url(#soft)"/>
    <circle cx="590.6" cy="385" r="17" fill="#fff4e6"/>

    <!-- вузли -->
    <circle cx="250" cy="640" r="120" fill="#4fd1c5" opacity=".28" filter="url(#glow)"/>
    <circle cx="250" cy="640" r="80" fill="#131a31" stroke="#4fd1c5" stroke-width="34"/>
    <circle cx="774" cy="640" r="130" fill="#ff9f43" opacity=".35" filter="url(#glow)"/>
    <circle cx="774" cy="640" r="96" fill="#ff9f43"/>
    <circle cx="774" cy="640" r="36" fill="#131a31"/>
  </g>
  <rect x="42" y="42" width="940" height="940" rx="212" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="4"/>
</svg>
